<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Generator - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px rgba(0,0,0,.3);
      text-align: center;
    }
    .login-card h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .login-card p {
      color: #94a3b8;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .login-card input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 16px;
      outline: none;
      transition: border-color .2s;
    }
    .login-card input[type="password"]:focus {
      border-color: #6366f1;
    }
    .login-card button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .login-card button:hover { background: #4f46e5; }
    .error {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <form class="login-card" method="POST" action="/login">
    <h1>Flashcard Generator</h1>
    <p>Enter the password to continue</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
