<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: #090909;
      color: #a1a1a1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .login-card {
      background: #141414;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .login-card h1 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #ededed;
      letter-spacing: -0.02em;
    }
    .login-card p {
      color: #555;
      margin-bottom: 28px;
      font-size: 13px;
    }
    .login-card input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      background: #090909;
      color: #ededed;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 150ms;
    }
    .login-card input[type="password"]:focus {
      border-color: rgba(255,255,255,.2);
    }
    .login-card input[type="password"]:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px rgba(255,255,255,.12);
    }
    .login-card button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #ededed;
      color: #090909;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms, transform 100ms;
      font-family: inherit;
    }
    .login-card button:hover { background: #d4d4d4; }
    .login-card button:active { transform: scale(.97); }
    .login-card button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px rgba(255,255,255,.2);
    }
    .error {
      background: rgba(255,50,50,.08);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,50,50,.1);
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <form class="login-card" method="POST" action="/login">
    <h1>Flashcard Generator</h1>
    <p>Enter the password to continue</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
